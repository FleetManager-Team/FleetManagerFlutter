name: fleetmanager
description: "A new Flutter project for fleet management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pacchetto per generare le icone
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Registrazione dell'immagine per l'app
  assets:
    - assets/images/app_icon.png

# Configurazione specifica per la generazione delle icone Android e iOS
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon.png"