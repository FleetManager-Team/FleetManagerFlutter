<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Fleet Manager Redirect</title>
  <script type="text/javascript">
    // Questo script "salva" il token del reset e lo riporta alla index.html
    var l = window.location;
    var segment = '/FleetManagerFlutter/';
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + segment + 'index.html' + l.search + l.hash);
  </script>
</head>

<body>
  Reindirizzamento in corso...
</body>

</html>
