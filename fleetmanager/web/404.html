<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fleet Manager</title>
    <script type="text/javascript">
      // Questo script reindirizza l'utente alla index.html 
      // mantenendo intatti i parametri del reset password (#access_token)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=/' +
        l.pathname.slice(1).replace(/&/g, '~and~') + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
