<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc">
  <title id="title">FleetManager — Use Case Diagram</title>
  <desc id="desc">Diagramma UML dei casi d'uso di Driver e Manager per il sistema FleetManager, con backend Supabase.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:30px;font-weight:700}.group{font-size:20px;font-weight:700;fill:#2f5597}.uc{fill:#f7fafc;stroke:#2f5597;stroke-width:2}.sys{fill:#fff;stroke:#334155;stroke-width:3}.assoc{stroke:#64748b;stroke-width:2;fill:none}.dep{stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.label{font-size:14px;fill:#6d28d9}.uct{font-size:15px;text-anchor:middle}.actor{stroke:#1f2937;stroke-width:3;fill:none}.actort{font-size:19px;font-weight:700;text-anchor:middle}.note{font-size:15px;text-anchor:middle;fill:#475569}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1600" height="1450" fill="#f8fafc"/>
  <text x="800" y="48" class="title" text-anchor="middle">FleetManager — Use Case Diagram</text>
  <rect x="245" y="78" width="1110" height="1235" rx="8" class="sys"/>
  <text x="270" y="112" class="group">Sistema FleetManager</text>
  <text x="520" y="163" class="group" text-anchor="middle">Funzioni Driver</text>
  <text x="1080" y="163" class="group" text-anchor="middle">Funzioni Manager</text>

  <!-- attori -->
  <g class="actor"><circle cx="110" cy="330" r="28"/><path d="M110 358v88M62 390h96M110 446l-48 72M110 446l48 72"/></g><text x="110" y="555" class="actort">Driver</text>
  <g class="actor"><circle cx="1490" cy="330" r="28"/><path d="M1490 358v88M1442 390h96M1490 446l-48 72M1490 446l48 72"/></g><text x="1490" y="555" class="actort">Manager</text>
  <g class="actor"><circle cx="800" cy="1370" r="24"/><path d="M800 1394v35M760 1412h80"/></g><text x="800" y="1340" class="actort">Backend Supabase</text>

  <!-- login condiviso -->
  <ellipse cx="800" cy="155" rx="145" ry="43" class="uc"/><text x="800" y="151" class="uct"><tspan x="800">UC-01</tspan><tspan x="800" dy="19">Effettuare login</tspan></text>

  <!-- driver -->
  <g class="uc"><ellipse cx="505" cy="245" rx="175" ry="43"/><ellipse cx="505" cy="345" rx="175" ry="43"/><ellipse cx="505" cy="445" rx="175" ry="43"/><ellipse cx="505" cy="545" rx="175" ry="43"/><ellipse cx="505" cy="645" rx="175" ry="43"/><ellipse cx="505" cy="745" rx="175" ry="43"/><ellipse cx="505" cy="845" rx="175" ry="43"/><ellipse cx="505" cy="945" rx="175" ry="43"/></g>
  <g class="uct"><text x="505" y="241"><tspan x="505">UC-02</tspan><tspan x="505" dy="19">Visualizzare veicoli disponibili</tspan></text><text x="505" y="341"><tspan x="505">UC-03</tspan><tspan x="505" dy="19">Richiedere prenotazione</tspan></text><text x="505" y="441"><tspan x="505">UC-04</tspan><tspan x="505" dy="19">Annullare propria prenotazione</tspan></text><text x="505" y="541"><tspan x="505">UC-05</tspan><tspan x="505" dy="19">Eseguire check-up iniziale</tspan></text><text x="505" y="641"><tspan x="505">UC-06</tspan><tspan x="505" dy="19">Restituire veicolo</tspan></text><text x="505" y="741"><tspan x="505">UC-07</tspan><tspan x="505" dy="19">Segnalare emergenza</tspan></text><text x="505" y="841"><tspan x="505">UC-08</tspan><tspan x="505" dy="19">Consultare notifiche personali</tspan></text><text x="505" y="941"><tspan x="505">UC-09</tspan><tspan x="505" dy="19">Visualizzare costi personali</tspan></text></g>

  <!-- manager -->
  <g class="uc"><ellipse cx="1095" cy="245" rx="185" ry="43"/><ellipse cx="1095" cy="345" rx="185" ry="43"/><ellipse cx="1095" cy="445" rx="185" ry="43"/><ellipse cx="1095" cy="545" rx="185" ry="43"/><ellipse cx="1095" cy="645" rx="185" ry="43"/><ellipse cx="1095" cy="745" rx="185" ry="43"/><ellipse cx="1095" cy="845" rx="185" ry="43"/><ellipse cx="1095" cy="945" rx="185" ry="43"/><ellipse cx="1095" cy="1045" rx="185" ry="43"/></g>
  <g class="uct"><text x="1095" y="241"><tspan x="1095">UC-10</tspan><tspan x="1095" dy="19">Gestire utenti (CRUD)</tspan></text><text x="1095" y="341"><tspan x="1095">UC-11</tspan><tspan x="1095" dy="19">Gestire veicoli (CRUD)</tspan></text><text x="1095" y="441"><tspan x="1095">UC-12</tspan><tspan x="1095" dy="19">Approvare/Rifiutare prenotazioni</tspan></text><text x="1095" y="541"><tspan x="1095">UC-13</tspan><tspan x="1095" dy="19">Pianificare manutenzione</tspan></text><text x="1095" y="641"><tspan x="1095">UC-14</tspan><tspan x="1095" dy="19">Chiudere intervento manutenzione</tspan></text><text x="1095" y="741"><tspan x="1095">UC-15</tspan><tspan x="1095" dy="19">Gestire scadenze tecniche</tspan></text><text x="1095" y="841"><tspan x="1095">UC-16</tspan><tspan x="1095" dy="19">Monitorare emergenze in corso</tspan></text><text x="1095" y="941"><tspan x="1095">UC-17</tspan><tspan x="1095" dy="19">Visualizzare dashboard costi</tspan></text><text x="1095" y="1041"><tspan x="1095">UC-18</tspan><tspan x="1095" dy="19">Modificare stato veicolo</tspan></text></g>

  <!-- use case di supporto -->
  <g class="uc"><ellipse cx="470" cy="1165" rx="170" ry="42"/><ellipse cx="800" cy="1165" rx="140" ry="42"/><ellipse cx="1130" cy="1165" rx="170" ry="42"/></g>
  <g class="uct"><text x="470" y="1161"><tspan x="470">Annullare prenotazioni</tspan><tspan x="470" dy="19">in conflitto</tspan></text><text x="800" y="1171">Inviare notifiche</text><text x="1130" y="1161"><tspan x="1130">Verificare scadenze</tspan><tspan x="1130" dy="19">imminenti</tspan></text></g>

  <!-- associazioni attori; una dorsale compatta evita l'affollamento -->
  <path d="M158 390H280V155H655M280 245H330M280 345H330M280 445H330M280 545H330M280 645H330M280 745H330M280 845H330M280 945H330" class="assoc"/>
  <path d="M1442 390H1320V155H945M1320 245H1280M1320 345H1280M1320 445H1280M1320 545H1280M1320 645H1280M1320 745H1280M1320 845H1280M1320 945H1280M1320 1045H1280" class="assoc"/>
  <path d="M800 1345V1207M800 1123V198" class="assoc" opacity=".38"/>

  <!-- dipendenze UML principali -->
  <path d="M505 302V289" class="dep"/><text x="520" y="300" class="label">«include»</text>
  <path d="M910 445C770 445 760 345 680 345" class="dep"/><text x="760" y="408" class="label">«extend»</text>
  <path d="M1030 484C900 650 665 1030 530 1124" class="dep"/><text x="730" y="845" class="label">«include» conflitti</text>
  <path d="M1095 488C1060 760 920 1045 825 1126" class="dep"/><text x="950" y="930" class="label">«include» notifiche</text>
  <path d="M1095 788V1122" class="dep"/><text x="1108" y="1105" class="label">«include» verifica giornaliera</text>
  <path d="M960 1165H942" class="dep"/><text x="950" y="1152" class="label">«include»</text>
  <path d="M910 445C760 470 720 530 680 545" class="dep"/><text x="760" y="505" class="label">«extend» se confermata</text>

  <text x="800" y="1280" class="note">Supabase supporta persistenza, autenticazione e storage dei file.</text>
</svg>
